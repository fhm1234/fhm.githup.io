<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <div class="htmleaf-container">
        <div class="wrapper">
            <div class="container">
                <h1>快乐</h1>
                <form class="form" id="loginForm">
                    <input id="userName" name="userName" type="text" placeholder="用户名" required>
                    <input id="pwd" name="pwd" type="password" placeholder="密码" required>
                    <button type="submit" id="login-button">进入</button>
                </form>
            </div>
            <ul class="bg-bubbles">
                <li></li><li></li><li></li><li></li><li></li>
                <li></li><li></li><li></li><li></li><li></li>
            </ul>
        </div>
    </div>

    <script src="js/jquery-2.1.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#loginForm').submit(function(e) {
                e.preventDefault();
                var userName = $('#userName').val();
                var pwd = $('#pwd').val();
                
                if(userName === '邓颖芳' && pwd === '0930') {
                    $('form').fadeOut(500);
                    $('.wrapper').addClass('form-success');
                    
                    setTimeout(function() {
                        window.location.href = 'html/index1.html';
                    }, 2000);
                } else {
                    alert('密码是你的生日哦!（密码为4位数）');
                }
            });
        });
    </script>
</body>
</html>
